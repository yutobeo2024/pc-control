<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Parental Control</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1>🔒 Parental Control</h1>
            <div class="header-actions">
                <button class="btn-notification" id="notificationBtn" title="Bật/Tắt thông báo">
                    <span class="notification-icon">🔔</span>
                    <span class="notification-status" id="notificationStatus">Off</span>
                </button>
                <div class="status-indicator" id="connectionStatus">
                    <span class="dot"></span>
                    <span class="text">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Pending Requests Section -->
        <section id="pendingRequests" class="section hidden">
            <div class="request-card">
                <div class="request-header">
                    <span class="icon">🔔</span>
                    <h2>Yêu cầu mở máy</h2>
                </div>
                <div class="request-info">
                    <div class="device-name" id="requestDeviceName">Loading...</div>
                    <div class="request-time" id="requestTime">Vừa xong</div>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-reject" id="rejectBtn">
                        <span class="btn-icon">✖</span>
                        <span class="btn-text">Từ chối</span>
                    </button>
                    <button class="btn btn-approve" id="approveBtn">
                        <span class="btn-icon">✓</span>
                        <span class="btn-text">Cho phép</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- No Requests Message -->
        <div id="noRequests" class="empty-state">
            <div class="empty-icon">✅</div>
            <div class="empty-text">Không có yêu cầu mới</div>
        </div>

        <!-- Devices List -->
        <section class="section">
            <h2 class="section-title">Thiết bị</h2>
            <div id="devicesList" class="devices-list">
                <div class="loading">Đang tải...</div>
            </div>
        </section>
    </div>

    <!-- Device Detail Modal -->
    <div id="deviceModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDeviceName">Device Name</h2>
                <button class="close-btn" id="closeModal">✖</button>
            </div>

            <div class="device-status-card">
                <div class="status-icon" id="modalStatusIcon">🔒</div>
                <div class="status-text" id="modalStatusText">Đã khóa</div>
                <div class="online-status" id="modalOnlineStatus">● Online</div>
            </div>

            <div id="timerCard" class="timer-card hidden">
                <div class="timer-label">⏱️ Thời gian còn lại</div>
                <div class="timer-display" id="timerDisplay">00:00:00</div>
            </div>

            <div class="control-section">
                <div class="lock-section">
                    <div class="section-label">🔒 Khóa máy tính</div>
                    <div class="lock-buttons">
                        <button class="btn btn-lock-now" data-delay="0">Khóa ngay</button>
                        <button class="btn btn-lock-delay" data-delay="30">Sau 30 phút</button>
                        <button class="btn btn-lock-delay" data-delay="60">Sau 1 giờ</button>
                        <button class="btn btn-lock-delay" data-delay="90">Sau 1.5 giờ</button>
                        <button class="btn btn-lock-delay" data-delay="120">Sau 2 giờ</button>
                        <button class="btn btn-lock-delay" data-delay="180">Sau 3 giờ</button>
                    </div>
                    <button class="btn btn-cancel-schedule hidden" id="cancelScheduleBtn">
                        ✖ Hủy lịch khóa
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toastMessage"></span>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <h1>🔒 Parental Control</h1>
                <p class="login-subtitle">Đăng nhập để tiếp tục</p>
            </div>
            <button id="googleSignInBtn" class="btn-google-signin">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.20454C17.64 8.56636 17.5827 7.95272 17.4764 7.36363H9V10.845H13.8436C13.635 11.97 13.0009 12.9231 12.0477 13.5613V15.8195H14.9564C16.6582 14.2527 17.64 11.9454 17.64 9.20454Z" fill="#4285F4"/>
                    <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5613C11.2418 14.1013 10.2109 14.4204 9 14.4204C6.65591 14.4204 4.67182 12.8372 3.96409 10.71H0.957275V13.0418C2.43818 15.9831 5.48182 18 9 18Z" fill="#34A853"/>
                    <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29V4.95818H0.957275C0.347727 6.17318 0 7.54772 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
                    <path d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z" fill="#EA4335"/>
                </svg>
                <span>Đăng nhập với Google</span>
            </button>
            <p class="login-info">⚠️ Chỉ tài khoản được phê duyệt mới đăng nhập được</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, update, set, remove, get, query, orderByChild, equalTo } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCEwSd8C71ZuKy49iGDH3iBjOz4ZIiRUNE",
            authDomain: "kanban-d775c.firebaseapp.com",
            databaseURL: "https://kanban-d775c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kanban-d775c",
            storageBucket: "kanban-d775c.firebasestorage.app",
            messagingSenderId: "879115643443",
            appId: "1:879115643443:web:4e923ae86e46087aa31146"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.db = db;
        window.dbRef = { ref, onValue, update, set, remove, get, query, orderByChild, equalTo };
        window.auth = auth;

        // Authentication handler
        const loginScreen = document.getElementById('loginScreen');
        const appScreen = document.querySelector('.app');
        const googleSignInBtn = document.getElementById('googleSignInBtn');

        // Google Sign In
        googleSignInBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                console.log('✅ Login successful:', user.email);

                // Firebase Rules sẽ tự động kiểm tra email
                // Nếu không được phép, sẽ bị lỗi khi truy cập database
            } catch (error) {
                console.error('Login error:', error);
                alert('Lỗi đăng nhập: ' + error.message);
            }
        });

        // Check auth state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in - try to access database to verify permission
                try {
                    // Test read permission
                    const testRef = window.dbRef.ref(window.db, 'devices');
                    await window.dbRef.onValue(testRef, () => {}, { onlyOnce: true });

                    // If successful, user is authorized
                    loginScreen.style.display = 'none';
                    appScreen.style.display = 'block';

                    // Load notifications first, then main app
                    if (!document.querySelector('script[src="notifications.js"]')) {
                        const notifScript = document.createElement('script');
                        notifScript.src = 'notifications.js';
                        document.body.appendChild(notifScript);
                    }

                    if (!document.querySelector('script[src="app.js"]')) {
                        const script = document.createElement('script');
                        script.src = 'app.js';
                        document.body.appendChild(script);
                    }
                } catch (error) {
                    // Permission denied - not authorized
                    console.error('Permission denied:', error);
                    await auth.signOut();
                    alert('❌ Email của bạn không được phép truy cập!\n\nChỉ tài khoản đã đăng ký mới có thể sử dụng.');
                    loginScreen.style.display = 'flex';
                    appScreen.style.display = 'none';
                }
            } else {
                // User is signed out
                loginScreen.style.display = 'flex';
                appScreen.style.display = 'none';
            }
        });
    </script>
</body>
</html>
