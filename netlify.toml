# Cấu hình Netlify ở GỐC repo.
#
# Netlify đọc netlify.toml ở gốc repository. File cấu hình thật của site nằm ở
# `web-app/netlify.toml`, nên nếu không có file này thì Netlify sẽ đi tìm thư
# mục `public/` ở gốc repo - không có - và deploy ra site rỗng.
#
# `base` chuyển thư mục làm việc sang `web-app` trước khi build, nhờ đó
# `publish = "public"` trỏ đúng vào `web-app/public`, và `web-app/netlify.toml`
# cũng được đọc. Hai file khai báo trùng nhau nên đọc file nào cũng ra kết quả
# giống nhau.
#
# Nhờ file này, khi nối site với GitHub bạn KHÔNG phải chỉnh Base directory hay
# Publish directory bằng tay trong dashboard nữa.

[build]
  base = "web-app"
  publish = "public"
  command = "echo 'No build needed - static site'"

# SPA fallback: mọi đường dẫn đều trả về index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
